services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.2-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30

  migrations:
    profiles: [app]
    build:
      context: .
      target: migrations
    command: ["--connection", "Host=postgres;Port=5432;Database=tasks;Username=postgres;Password=postgres"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build:
      context: .
      target: api
    environment:
      ConnectionStrings__Tasks: Host=postgres;Port=5432;Database=tasks;Username=postgres;Password=postgres
      RabbitMq__Uri: amqp://guest:guest@rabbitmq:5672/
    ports:
      - "5080:8080"
    stop_grace_period: 15s
    depends_on:
      migrations:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_started
